services:
  v1:
    build: ./app/v1
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  v2:
    build: ./app/v2
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    # Mounted so switch.sh can change the config and reload without a rebuild
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      v1:
        condition: service_healthy
      v2:
        condition: service_healthy
