# ACTIVE CONFIG: Canary (95% v1, 5% v2)
# Change the weights to move more traffic to v2, or run ./switch.sh to swap configs.
upstream app_backend {
    server v1:3001 weight=95 max_fails=3 fail_timeout=10s;
    server v2:3002 weight=5  max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_backend;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
